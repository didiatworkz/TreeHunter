services:
  app:
    image: '${TREEHUNTER_IMAGE:-atworkz/treehunter:latest}'
    ports:
      - '${APP_PORT:-8080}:80'
    environment:
      APP_KEY: '${APP_KEY:?Set APP_KEY in .env}'
      APP_URL: '${APP_URL:-http://localhost:8080}'
      APP_NAME: '${APP_NAME:-TreeHunter}'
      APP_ENV: production
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
      DB_CONNECTION: '${DB_CONNECTION:-sqlite}'
      DB_HOST: '${DB_HOST:-}'
      DB_PORT: '${DB_PORT:-3306}'
      DB_DATABASE: '${DB_DATABASE:-}'
      DB_USERNAME: '${DB_USERNAME:-}'
      DB_PASSWORD: '${DB_PASSWORD:-}'
      SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-false}'
      REGISTRATION_ENABLED: '${REGISTRATION_ENABLED:-true}'
      AUTO_MIGRATE: '${AUTO_MIGRATE:-true}'
      MAIL_MAILER: '${MAIL_MAILER:-log}'
      MAIL_HOST: '${MAIL_HOST:-}'
      MAIL_PORT: '${MAIL_PORT:-2525}'
      MAIL_USERNAME: '${MAIL_USERNAME:-}'
      MAIL_PASSWORD: '${MAIL_PASSWORD:-}'
      MAIL_SCHEME: '${MAIL_SCHEME:-}'
      MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS:-hello@example.com}'
      MAIL_FROM_NAME: '${MAIL_FROM_NAME:-TreeHunter}'
    volumes:
      - treehunter-storage:/var/www/html/storage
    restart: unless-stopped

volumes:
  treehunter-storage:
